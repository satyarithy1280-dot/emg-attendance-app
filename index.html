<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EMG Attendance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#888);
        --btn:var(--tg-theme-button-color,#2481cc);--btnfg:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f2f5)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans Khmer","Khmer OS",system-ui,sans-serif}
  .wrap{max-width:480px;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
  h1{font-size:18px;margin:4px 0 2px}
  .sub{color:var(--hint);font-size:14px;margin-bottom:10px}
  .cam{position:relative;width:100%;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#000}
  video,canvas.snap{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  canvas.snap{display:none}
  .pill{position:absolute;left:10px;top:10px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;background:rgba(0,0,0,.55);color:#fff}
  .pill.ok{background:rgba(22,163,74,.9)} .pill.bad{background:rgba(220,38,38,.9)} .pill.wait{background:rgba(0,0,0,.55)}
  .shutter{display:block;width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:700;background:var(--btn);color:var(--btnfg)}
  .shutter:disabled{opacity:.45}
  .msg{margin-top:12px;padding:12px;border-radius:12px;background:var(--card);font-size:15px;line-height:1.5;white-space:pre-wrap}
  .msg.err{background:#fde8e8;color:#9b1c1c}
  .done{text-align:center;padding-top:40px}
  .done .big{font-size:64px}
  .camhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:15px;text-align:center;padding:20px}
  .stat{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--hint)}
  .link{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid var(--btn);border-radius:12px;background:transparent;color:var(--btn);font-size:15px}
  .hidden{display:none !important}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="main">
    <h1 id="title">កំពុងផ្ទុក…</h1>
    <div class="sub" id="sub">&nbsp;</div>
    <div class="cam">
      <video id="video" playsinline autoplay muted></video>
      <canvas class="snap" id="snap"></canvas>
      <div class="pill wait" id="pill">📍 —</div>
      <div class="camhint" id="camhint">📷 ចុចប៊ូតុងខាងក្រោម ដើម្បីបើកកាមេរ៉ា</div>
    </div>
    <div class="stat"><span id="sCam">📷 កាមេរ៉ា៖ —</span><span id="sGps">📍 ទីតាំង៖ —</span></div>
    <button class="shutter" id="shutter">▶ បើកកាមេរ៉ា + ទីតាំង</button>
    <button class="link hidden" id="settings">⚙️ បើកការកំណត់ Telegram (អនុញ្ញាតទីតាំង)</button>
    <div class="msg hidden" id="msg"></div>
  </div>
  <div id="done" class="done hidden">
    <div class="big">✅</div>
    <div class="msg" id="doneMsg"></div>
  </div>
</div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwcAxTJ08_dQ9WvD4Fcq8BZPl813JBfl4ZcEq1sZ9-n01VVjltAH2ERIBv_pet3RbhjmQ/exec?mode=app';
  var tg = window.Telegram && Telegram.WebApp;
  var $ = function (id) { return document.getElementById(id); };
  var info = null, fix = null, busy = false, stream = null, gpsSrc = '', watchId = null, tgPoll = null, camErr = '', gpsErr = '';
  var initData = tg ? tg.initData : '';
  var start = tg && tg.initDataUnsafe ? (tg.initDataUnsafe.start_param || '') : '';
  var q = new URLSearchParams(location.search);
  var evt = (q.get('evt') || start || 'in').toLowerCase() === 'out' ? 'out' : 'in';
  if (tg) { tg.ready(); tg.expand(); }

  function haptic(t) { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} }
  function showMsg(text, err) { var m = $('msg'); m.textContent = text; m.className = 'msg' + (err ? ' err' : ''); }
  function hideMsg() { $('msg').className = 'msg hidden'; }
  function call(body) {
    body.initData = initData;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
      .then(function (r) { return r.json(); });
  }
  function dist(a, b, c, d) {
    var R = 6371000, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
    var h = Math.sin(x / 2) * Math.sin(x / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) * Math.sin(y / 2);
    return Math.round(2 * R * Math.asin(Math.sqrt(h)));
  }
  var exempt = function () { return !!(info && info.exempt); };

  function refresh() {
    var pill = $('pill'), gpsOk = false;
    if (exempt()) {
      pill.className = 'pill ok';
      pill.textContent = '🔓 Admin — មិនពិនិត្យទីតាំង' + (fix && info ? ' (' + dist(fix.lat, fix.lon, info.lat, info.lon) + 'm)' : '');
      gpsOk = true;
    } else if (!fix) { pill.className = 'pill wait'; pill.innerHTML = gpsErr ? '📍 គ្មានទីតាំង' : '<span class="spin"></span>កំពុងស្វែងរកទីតាំង…'; }
    else if (!info) { pill.className = 'pill wait'; pill.textContent = '📍 ±' + fix.acc + 'm'; }
    else {
      var d = dist(fix.lat, fix.lon, info.lat, info.lon);
      if (fix.acc > info.maxAcc) { pill.className = 'pill bad'; pill.textContent = '📍 GPS មិនច្បាស់ ±' + fix.acc + 'm'; }
      else if (d > info.radius) { pill.className = 'pill bad'; pill.textContent = '📍 ឆ្ងាយ ' + d + 'm (≤' + info.radius + 'm)'; }
      else { pill.className = 'pill ok'; pill.textContent = '📍 នៅសាខា ' + d + 'm ✓'; gpsOk = true; }
    }
    $('sCam').textContent = '📷 កាមេរ៉ា៖ ' + (stream ? '✅' : (camErr ? '❌ ' + camErr : '—'));
    $('sGps').textContent = '📍 ទីតាំង៖ ' + (fix ? '✅ ±' + fix.acc + 'm' + (gpsSrc ? ' (' + gpsSrc + ')' : '') : (gpsErr ? '❌ ' + gpsErr : '…'));
    $('camhint').style.display = stream ? 'none' : 'flex';
    var sh = $('shutter');
    if (busy) { sh.disabled = true; return; }
    if (!stream) { sh.disabled = false; sh.textContent = '▶ បើកកាមេរ៉ា + ទីតាំង'; return; }
    sh.textContent = '📸 ថតរូប និងកត់ត្រា';
    sh.disabled = !(info && gpsOk);
  }

  function setFix(lat, lon, acc, src) { fix = { lat: lat, lon: lon, acc: Math.round(acc || 0) }; gpsSrc = src; gpsErr = ''; $('settings').className = 'link hidden'; refresh(); }

  // Telegram's own location service (Bot API 8.0+) — used when the WebView geolocation is blocked.
  function tgLocation() {
    var lm = tg && tg.LocationManager;
    if (!lm) { gpsErr = 'សូមអនុញ្ញាត Location ឱ្យ Telegram'; refresh(); return; }
    var get = function () {
      if (!lm.isLocationAvailable) { gpsErr = 'ទូរស័ព្ទមិនមាន GPS'; refresh(); return; }
      lm.getLocation(function (loc) {
        if (loc) { setFix(loc.latitude, loc.longitude, loc.horizontal_accuracy, 'Telegram'); if (!tgPoll) tgPoll = setInterval(get, 8000); }
        else {
          gpsErr = 'មិនបានអនុញ្ញាតទីតាំង'; refresh();
          if (lm.isAccessRequested && !lm.isAccessGranted) $('settings').className = 'link';
        }
      });
    };
    if (lm.isInited) get(); else lm.init(get);
  }

  function startGps() {
    if (watchId !== null || tgPoll) return;
    if (!navigator.geolocation) return tgLocation();
    watchId = navigator.geolocation.watchPosition(function (p) {
      setFix(p.coords.latitude, p.coords.longitude, p.coords.accuracy, '');
    }, function (e) {
      try { navigator.geolocation.clearWatch(watchId); } catch (x) {}
      watchId = null;
      if (!fix) tgLocation();
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  }

  function startCam() {
    if (stream) return Promise.resolve();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camErr = 'មិនគាំទ្រ'; refresh(); return Promise.resolve(); }
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 1280 } }, audio: false })
      .then(function (s) { stream = s; camErr = ''; var v = $('video'); v.srcObject = s; try { v.play(); } catch (e) {} refresh(); })
      .catch(function (e) { camErr = (e && e.name === 'NotAllowedError') ? 'មិនបានអនុញ្ញាត' : (e && e.name || 'error'); refresh(); });
  }

  function capture() {
    var v = $('video'), c = $('snap');
    var w = v.videoWidth, h = v.videoHeight, max = 720, k = Math.min(1, max / Math.max(w, h));
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    var x = c.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(v, 0, 0, c.width, c.height);
    c.style.display = 'block';
    return c.toDataURL('image/jpeg', 0.75);
  }

  function stopAll() {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    if (watchId !== null) try { navigator.geolocation.clearWatch(watchId); } catch (e) {}
    if (tgPoll) clearInterval(tgPoll);
  }

  $('settings').addEventListener('click', function () { try { tg.LocationManager.openSettings(); } catch (e) {} });

  $('shutter').addEventListener('click', function () {
    if (busy) return;
    if (!stream) { hideMsg(); startCam(); startGps(); return; }  // first tap = user gesture → permission prompts work
    if (!exempt() && !fix) return;
    busy = true; refresh(); hideMsg();
    var photo = capture();
    try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
    $('shutter').innerHTML = '<span class="spin"></span>កំពុងកត់ត្រា…';
    var body = { action: 'punch', evt: evt, photo: photo };
    if (fix) { body.lat = fix.lat; body.lon = fix.lon; body.acc = fix.acc; }
    call(body).then(function (r) {
      if (r.ok) {
        haptic('success'); stopAll();
        $('main').className = 'hidden'; $('done').className = 'done'; $('doneMsg').textContent = r.msg;
        setTimeout(function () { if (tg) tg.close(); }, 2500);
      } else {
        haptic('error'); showMsg(r.msg, true); $('snap').style.display = 'none'; busy = false; refresh();
      }
    }).catch(function () {
      haptic('error'); showMsg('⚠️ បណ្តាញមានបញ្ហា។ សូមព្យាយាមម្តងទៀត។', true); $('snap').style.display = 'none'; busy = false; refresh();
    });
  });

  $('title').textContent = evt === 'out' ? '📸 ចេញពីធ្វើការ' : '📸 ចូលធ្វើការ';
  refresh();
  if (!initData) { showMsg('សូមបើកទំព័រនេះពីក្នុង Telegram (ប៊ូតុង /checkin ឬ /checkout)។', true); $('shutter').disabled = true; return; }

  startCam(); startGps();   // try silently; if the WebView needs a tap, the button does it
  call({ action: 'prep', evt: evt }).then(function (r) {
    if (!r.ok) { showMsg(r.msg, true); haptic('error'); return; }
    info = r; evt = r.evt;
    $('title').textContent = '📸 ' + r.evtKh + ' — ' + r.name;
    $('sub').textContent = r.branchKh + (r.exempt ? ' · 🔓 Admin (គ្មានការកំណត់ចម្ងាយ)' : ' · ចម្ងាយអនុញ្ញាត ' + r.radius + 'm');
    if (r.already) { showMsg(r.already, true); $('shutter').classList.add('hidden'); stopAll(); return; }
    refresh();
  }).catch(function () { showMsg('⚠️ មិនអាចភ្ជាប់ទៅម៉ាស៊ីនមេបានទេ។ សូមព្យាយាមម្តងទៀត។', true); });
})();
</script>
</body>
</html>
